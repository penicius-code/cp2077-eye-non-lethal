# Cyberslop Eye Non-Lethal 1.3.0 (2026-11-02; list from 1.1.0, 2026-11-01): the eyes that can run non-lethal mode,
# and their tooltip line. Basic Kiroshi and KIROSHI Non-Lethal (12503) at every tier; every other Kiroshi model
# from Epic (Tier 4) up; 1.3.0: Kiroshi Optics Echo (Nexus 34618, Items.EchoOptics, block at the end).
# The switch itself: r6\scripts\zz_CyberslopEyeNonLethal. Generated list, one block per item record
# (TweakXL appends don't pass to child records).
Items.CyberslopNonLethalEyesPackage:
  $type: gamedataGameplayLogicPackage
  UIData:
    localizedDescription: "<Rich color=\"#905FD4\">Non-lethal mode: knocks humans out instead of killing. Toggle with the key left of Z.</>"

